<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--sidebar:#111827;--sidebar-2:#0f172a;--sidebar-text:#cbd5e1;--sidebar-muted:#94a3b8;--bg:#f4f6f9;--surface:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--success:#16a34a;--danger:#dc2626;--warning:#d97706;--radius:8px;--shadow:0 1px 3px rgba(15,23,42,.08)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}body{min-height:100vh}.hide{display:none!important}
.app-sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#fff;z-index:1000;overflow-y:auto;box-shadow:2px 0 8px rgba(0,0,0,.12)}.brand{height:64px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:700;font-size:16px}.brand-icon{width:34px;height:34px;border-radius:8px;background:var(--primary);display:grid;place-items:center;margin-right:10px;font-weight:800}.brand small{display:block;color:#94a3b8;font-size:10px;font-weight:500;margin-top:1px}.sidebar-title{padding:18px 18px 7px;text-transform:uppercase;font-size:10px;letter-spacing:.08em;color:#64748b;font-weight:700}.side-nav{padding:0 10px 20px}.side-nav button{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--sidebar-text);text-align:left;border-radius:6px;padding:10px 11px;margin:2px 0;font:inherit;font-size:13px;cursor:pointer;transition:.15s}.side-nav button:hover{background:rgba(255,255,255,.07);color:#fff}.side-nav button.active{background:var(--primary);color:#fff;box-shadow:0 3px 8px rgba(37,99,235,.25)}.side-icon{width:20px;text-align:center;opacity:.9}.side-nav .admin-link{display:none}.side-nav .admin-link.show-admin{display:flex}.app-sidebar[data-role="admin"] .admin-link{display:flex}
.app-main{margin-left:250px;min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:900;box-shadow:0 1px 2px rgba(15,23,42,.04)}.page-title{font-size:18px;font-weight:650}.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}.dbstatus{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#64748b}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;box-shadow:0 0 0 3px #dcfce7}.user-chip{font-size:12px;color:#475569;padding-left:12px;border-left:1px solid var(--line)}
.wrap{max-width:none;margin:0;padding:22px 24px 35px}.tabs{display:none}.content-section{min-width:0}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stat{font-size:26px;font-weight:700;letter-spacing:-.3px;margin-top:5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.formgrid label,.editgrid label{font-weight:600;color:#374151}.formgrid input,.formgrid select,.formgrid textarea,.editgrid input{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:6px;margin-top:5px;background:#fff;outline:none;font:inherit;color:#111827}.formgrid input:focus,.formgrid select:focus,.formgrid textarea:focus,.editgrid input:focus,.searchbox:focus,.filterbox:focus{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(59,130,246,.12)}.full{grid-column:1/-1}
.btn{border:1px solid transparent;border-radius:6px;padding:8px 12px;margin:0;cursor:pointer;font:inherit;font-weight:600;transition:background .15s,border-color .15s,box-shadow .15s}.btn:hover{filter:brightness(.97);transform:none}.btn:active{transform:translateY(1px)}.btn:focus-visible,.side-nav button:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}.btn{background:var(--primary);color:#fff}.btn.secondary{background:#64748b}.btn.danger{background:var(--danger)}.btn.success{background:var(--success)}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}th,td{border:0;border-bottom:1px solid var(--line);padding:9px 10px;font-size:12.5px;vertical-align:middle}th{background:#f8fafc;color:#374151;font-weight:650;white-space:nowrap}tr:last-child td{border-bottom:0}tr:hover td{background:#f9fafb}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.searchbox,.filterbox{padding:9px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;outline:none;font:inherit}.searchbox{min-width:260px}.filebtn{display:inline-flex;align-items:center;gap:7px;background:var(--success);color:#fff;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer}.filebtn input{display:none}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:10px}.pager button:disabled{opacity:.45;cursor:not-allowed}.badgebad{background:#fee2e2;color:#b91c1c}.importtable{max-height:300px;margin-top:8px}.small{font-size:12px;color:var(--muted)}.scroll{overflow:auto}.editgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detailgrid>div{padding:10px;border:1px solid #e5e7eb;border-radius:7px}.detailgrid b{display:block;margin-top:4px}.danger{background:#dc2626!important;color:#fff!important}.barrow{display:grid;grid-template-columns:180px 1fr 70px;gap:8px;align-items:center;margin:7px 0}.bar{height:10px;border:1px solid #d1d5db;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#3b82f6}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#f3f4f6;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:2000;padding:5vh 5vw}.modalbox{background:#fff;height:90vh;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,23,42,.25)}.modalhead{min-height:52px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalbody{padding:14px;overflow:auto;flex:1}.preview{width:100%;height:calc(100% - 50px);border:0}
#msg{position:fixed;right:20px;top:76px;width:min(380px,calc(100vw - 40px));z-index:5000;pointer-events:none}#msg .msg{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;border-radius:7px;margin:0 0 8px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.14);font-size:13px;line-height:1.35;pointer-events:auto;animation:toastIn .18s ease-out}.msg.ok{border-left:4px solid var(--success);color:#166534}.msg.err{border-left:4px solid var(--danger);color:#991b1b}@keyframes toastIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e3a8a);display:flex;align-items:center;justify-content:center;z-index:9999}.loginBox{width:min(410px,92vw);background:#fff;border-radius:10px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.loginBox h2{margin:0 0 4px;font-size:22px}.loginBox .input{width:100%;box-sizing:border-box;margin:8px 0;padding:10px 11px;border:1px solid #d1d5db;border-radius:6px;font:inherit}.loginOverlay.hide{display:none}
@media(max-width:900px){.app-sidebar{width:220px}.app-main{margin-left:220px}.wrap{padding:18px}.formgrid,.editgrid{grid-template-columns:1fr}.modal{padding:2vh 2vw}.modalbox{height:96vh}}@media(max-width:700px){.app-sidebar{transform:translateX(-100%);transition:.2s}.app-sidebar.open{transform:translateX(0)}.app-main{margin-left:0}.topbar{padding:0 14px}.menu-toggle{display:grid!important}.wrap{padding:14px}.detailgrid{grid-template-columns:1fr}.searchbox{min-width:0;width:100%}.modal{padding:1vh}.modalbox{height:98vh}.page-title{font-size:16px}}
.menu-toggle{display:none;border:0;background:transparent;font-size:22px;cursor:pointer;margin-right:10px}.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999}.backdrop.show{display:block}
</style></head><body>
<div id="loginOverlay" class="loginOverlay"><div class="loginBox"><h2>Jurnal Wali Kelas Digital</h2><div class="small">Silakan masuk untuk melanjutkan.</div><input id="loginUser" class="input" placeholder="Username" autocomplete="username"><input id="loginPass" class="input" type="password" placeholder="Password" autocomplete="current-password"><button class="btn success" style="width:100%" onclick="doLogin()">Masuk</button><div id="loginMsg" class="small"></div></div></div>
<div class="app-sidebar" id="appSidebar"><div class="brand"><div class="brand-icon">JW</div><div>Jurnal Wali Kelas<small>Digital Management</small></div></div><div class="sidebar-title">MENU UTAMA</div><nav class="side-nav"><button data-target="dash" onclick="show('dash')"><span class="side-icon">⌂</span>Dashboard</button><button data-target="siswa" onclick="show('siswa')"><span class="side-icon">♙</span>Data Siswa</button><button data-target="abs" onclick="show('abs')"><span class="side-icon">✓</span>Absensi</button><button data-target="pel" onclick="show('pel')"><span class="side-icon">!</span>Pelanggaran</button><button data-target="rew" onclick="show('rew')"><span class="side-icon">★</span>Penghargaan</button><button data-target="rekap" onclick="show('rekap')"><span class="side-icon">▤</span>Rekap & Laporan</button><button data-target="dok" onclick="show('dok')"><span class="side-icon">▣</span>Dokumen</button><button data-target="bina" onclick="show('bina')"><span class="side-icon">⚑</span>Pembinaan</button><button class="admin-link" data-role="admin" data-target="admin" onclick="show('admin')"><span class="side-icon">⚙</span>Administrasi</button></nav></div><div class="backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
<div class="app-main"><header class="topbar"><button class="menu-toggle" onclick="toggleSidebar(true)">☰</button><div class="page-title" id="pageTitle">Dashboard</div><div class="top-actions"><span id="dbstatus" class="dbstatus"><span class="dot"></span> Database tersinkron</span><span class="user-chip" id="topUser">Wali Kelas</span><button class="btn secondary" onclick="doLogout()">Keluar</button></div></header><div class="wrap"><div id="msg"></div><section id="dash"></section><section id="siswa" class="hide"></section><section id="abs" class="hide"></section><section id="pel" class="hide"></section><section id="rew" class="hide"></section><section id="rekap" class="hide"></section><section id="dok" class="hide"></section><section id="bina" class="hide"></section><section id="admin" class="hide"></section></div></div><div id="modal" class="modal hide"><div class="modalbox"><div class="modalhead"><b id="modalTitle">Detail</b><button class="btn secondary" onclick="closeModal()">Tutup</button></div><div id="modalBody" class="modalbody"></div></div></div>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>

let dbVersion='0',syncTimer=null;
async function refreshLiveDatabase(){try{const v=await call('getDbVersion');if(dbVersion==='0'){dbVersion=String(v);return;}if(String(v)!==dbVersion){dbVersion=String(v);students=[];pelMaster=[];rewMaster=[];const active=document.querySelector('section:not(.hide)');if(active){if(active.id==='dash')loadDash();else if(active.id==='siswa')loadSiswa();else if(active.id==='abs')loadAbs();else if(active.id==='pel')loadPel();else if(active.id==='rew')loadRew();else if(active.id==='rekap')loadRekap();}const el=$('dbstatus');if(el)el.innerHTML='<span class="dot"></span> Database diperbarui otomatis';}}catch(e){}}
function startLiveSync(){if(syncTimer)clearInterval(syncTimer);syncTimer=setInterval(refreshLiveDatabase,60000);refreshLiveDatabase();}
let students=[],pelMaster=[],rewMaster=[],studentsLoaded=false,pelMasterLoaded=false,rewMasterLoaded=false,lastParams=null,lastData=[];const $=id=>document.getElementById(id);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function call(fn,...args){return new Promise((resolve,reject)=>{if(!fn)return reject(new Error('Nama API kosong.'));const runner=google.script.run.withSuccessHandler(r=>{if(r&&r.success===false&&r.message)reject(new Error(r.message));else resolve(r&&Object.prototype.hasOwnProperty.call(r,'data')?r.data:r)}).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));try{if(typeof runner.api!=='function')return reject(new Error('API Gateway tidak tersedia. Deployment masih menggunakan versi lama. Silakan deploy versi terbaru.'));const publicFns=['login','getSession','logout'];if(publicFns.includes(fn))runner.api(fn,args);else runner.api(fn,args,window.AUTH_TOKEN||'');}catch(e){reject(e)}})}
function diagnoseApi(){return call('getSiswaAktif').then(()=>notify('API getSiswaAktif OK. Tidak ada pemanggilan runner.getSiswaAktif.',false)).catch(e=>notify('API check gagal: '+e.message,true))}
function notify(t,err=false){$('msg').innerHTML='<div class="msg '+(err?'err':'ok')+'">'+esc(t)+'</div>';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(function(){$('msg').innerHTML=''},4200)}
function show(id){document.querySelectorAll('section').forEach(function(x){x.classList.add('hide')});$(id).classList.remove('hide');document.querySelectorAll('.side-nav button').forEach(function(b){b.classList.toggle('active',b.dataset.target===id)});var names={dash:'Dashboard',siswa:'Data Siswa',abs:'Absensi',pel:'Pelanggaran',rew:'Penghargaan',rekap:'Rekap & Laporan',dok:'Dokumen',bina:'Pembinaan',admin:'Administrasi'};$('pageTitle').textContent=names[id]||'Jurnal Wali Kelas';toggleSidebar(false);if(id==='dash')loadDash();if(id==='siswa')loadSiswa();if(id==='abs')loadAbs();if(id==='pel')loadPel();if(id==='rew')loadRew();if(id==='rekap')loadRekap();if(id==='dok')loadDok();if(id==='bina')loadBina();if(id==='admin')loadAdmin()}
async function checkPelanggaranEndpoint(){
  try {
    const x=await call('testGetPelanggaranOptions');
    notify('Koneksi master pelanggaran OK: '+(x.count||0)+' data.');
    return x;
  } catch(e) {
    notify('Endpoint getPelanggaranOptions belum tersedia pada deployment ini. Deploy versi baru Apps Script lalu refresh.',true);
    throw e;
  }
}
async function ensureStudents(){if(studentsLoaded&&students.length)return students;students=await call('getSiswaAktif');studentsLoaded=true;return students}
async function ensurePelMaster(){if(pelMasterLoaded&&pelMaster.length)return pelMaster;const pm=await call('getPelanggaranOptions');pelMaster=Array.isArray(pm)?pm:(pm&&Array.isArray(pm.data)?pm.data:[]);pelMasterLoaded=true;return pelMaster}
async function ensureRewMaster(){if(rewMasterLoaded&&rewMaster.length)return rewMaster;const rw=await call('getMasterPenghargaan');rewMaster=Array.isArray(rw)?rw:(rw&&rw.data?rw.data:[]);rewMasterLoaded=true;return rewMaster}
async function loadAdmin(){
  try{
    let d=await call('getAdminSummary');
    if(d&&d.data&&typeof d.data==='object') d=d.data;
    if(!d||typeof d!=='object'){
      const v=await call('getDbVersion').catch(()=>null);
      throw new Error(v!==null?'Endpoint Administrasi mengembalikan respons kosong. Coba refresh sekali lagi.':'Koneksi API Administrasi gagal. Pastikan deployment terbaru aktif.');
    }
    const sheets=Array.isArray(d.sheets)?d.sheets:[];
    $('admin').innerHTML='<h2>Administrasi Sistem</h2><div class="small">Backup, export, validasi database, cache dan audit log.</div><div class="grid"><div class="card"><div>Spreadsheet</div><b>'+esc(d.name||'Spreadsheet')+'</b></div><div class="card"><div>Versi Database</div><b>'+esc(d.dbVersion||'-')+'</b></div><div class="card"><div>Jumlah Sheet</div><b>'+sheets.length+'</b></div></div><div class="card"><h3>Manajemen Pengguna</h3><div class="toolbar"><input id="newU" placeholder="Username"><input id="newN" placeholder="Nama lengkap"><select id="newR"><option value="wali_kelas">Wali Kelas</option><option value="guru">Guru</option><option value="bk">BK</option><option value="kepala_sekolah">Kepala Sekolah</option><option value="admin">Admin</option></select><input id="newP" type="password" placeholder="Password min. 8"><button class="btn success" onclick="saveNewUser()">Tambah User</button></div><div id="users"></div></div><div class="toolbar"><button class="btn success" onclick="doBackup()">Backup Database</button><button class="btn" onclick="doExportCsv()">Export Semua Sheet (ZIP CSV)</button><button class="btn secondary" onclick="doValidateDb()">Validasi Database</button><button class="btn secondary" onclick="doClearCache()">Bersihkan Cache</button></div><div id="adminResult"></div><div class="card"><h3>Audit Log Terbaru</h3><button class="btn secondary" onclick="loadAudit()">Refresh Log</button><div id="audit"></div></div></div>';
    await Promise.all([loadAudit(),loadUsers()]);
  }catch(e){$('admin').innerHTML='<div class="msg err">'+esc(e&&e.message?e.message:e)+'</div>'}
}
async function doBackup(){try{const r=await call('backupDatabase');$('adminResult').innerHTML='<div class="msg ok">Backup berhasil: <a target="_blank" href="'+esc(r.url)+'">'+esc(r.name)+'</a></div>'}catch(e){notify(e.message,true)}}
async function doExportCsv(){try{const r=await call('exportDatabaseCsv');$('adminResult').innerHTML='<div class="msg ok">Export berhasil: <a target="_blank" href="'+esc(r.downloadUrl||r.url)+'">'+esc(r.name)+'</a></div>'}catch(e){notify(e.message,true)}}
async function doValidateDb(){try{const r=await call('validateDatabaseDetailed');const bad=(r.checks||[]).filter(x=>!x.ok);$('adminResult').innerHTML='<div class="msg '+(r.ok?'ok':'err')+'"><b>'+ (r.ok?'Database valid':'Ada masalah pada database')+'</b><br>'+r.checks.map(x=>esc(x.sheet)+': '+(x.ok?'OK':'Gagal — '+esc((x.missing||[]).join(', ')))).join('<br>')+'</div>'}catch(e){notify(e.message,true)}}
async function doClearCache(){try{await call('clearApplicationCache');notify('Cache aplikasi berhasil dibersihkan.')}catch(e){notify(e.message,true)}}
async function loadUsers(){try{const rows=await call('listUsers');$('users').innerHTML='<div class="scroll"><table><tr><th>Username</th><th>Nama</th><th>Role</th><th>Status</th><th>Aksi</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.username)+'</td><td>'+esc(r.nama)+'</td><td>'+esc(r.role)+'</td><td>'+esc(r.status)+'</td><td><button class="btn danger" onclick="removeUser(\''+esc(r.id)+'\')">Hapus</button></td></tr>').join('')+'</table></div>'}catch(e){$('users').innerHTML='<div class="msg err">'+esc(e.message||e)+'</div>'}}
async function saveNewUser(){try{const data={username:$('newU').value,nama:$('newN').value,role:$('newR').value,password:$('newP').value,status:'aktif'};await call('saveUser',data);notify('User berhasil ditambahkan.');['newU','newN','newP'].forEach(id=>$(id).value='');loadUsers()}catch(e){notify(e.message,true)}}
async function removeUser(id){if(!confirm('Hapus user ini?'))return;try{await call('deleteUser',id);notify('User dihapus.');loadUsers()}catch(e){notify(e.message,true)}}
async function loadAudit(){try{const rows=await call('getAuditLog',50);$('audit').innerHTML='<div class="scroll"><table><tr><th>Waktu</th><th>User</th><th>Aktivitas</th><th>Detail</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.timestamp)+'</td><td>'+esc(r.user)+'</td><td>'+esc(r.aktivitas)+'</td><td>'+esc(r.detail)+'</td></tr>').join('')+'</table></div>'}catch(e){$('audit').innerHTML='<div class="msg err">'+esc(e.message||e)+'</div>'}}
window.AUTH_TOKEN=sessionStorage.getItem('JWK_AUTH_TOKEN')||'';window.AUTH_USER=null;
async function doLogin(){const u=$('loginUser').value.trim(),p=$('loginPass').value;const m=$('loginMsg');m.textContent='Memproses...';try{const r=await call('login',u,p);window.AUTH_TOKEN=r.token;window.AUTH_USER=r.user;sessionStorage.setItem('JWK_AUTH_TOKEN',r.token);$('loginOverlay').classList.add('hide');applyRoleUI();await init();}catch(e){m.textContent=e.message||String(e)}}
async function restoreSession(){if(!window.AUTH_TOKEN)return false;try{const r=await call('getSession',window.AUTH_TOKEN);if(r&&r.user){window.AUTH_USER=r.user;$('loginOverlay').classList.add('hide');applyRoleUI();return true}}catch(e){}sessionStorage.removeItem('JWK_AUTH_TOKEN');window.AUTH_TOKEN='';return false}
function applyRoleUI(){const role=window.AUTH_USER&&window.AUTH_USER.role||'';document.body.dataset.role=role;const sb=$('appSidebar');if(sb)sb.dataset.role=role;document.querySelectorAll('[data-role]').forEach(el=>{const allowed=el.dataset.role.split(',').includes(role);if(el.classList.contains('admin-link'))el.classList.toggle('show-admin',allowed);else el.style.display=allowed?'':'none'});if(window.AUTH_USER){$('topUser').textContent=(window.AUTH_USER.nama||window.AUTH_USER.username||'Pengguna')+' · '+role;}}
async function doLogout(){try{await call('logout',window.AUTH_TOKEN)}catch(e){}sessionStorage.removeItem('JWK_AUTH_TOKEN');window.AUTH_TOKEN='';window.AUTH_USER=null;location.reload()}
async function init(){try{await ensureStudents();await loadDash();startLiveSync()}catch(e){notify(e.message||e,true)}}

async function loadSiswa(){allStudents=await call('getSiswaSemua');refreshStudentCache();const classes=[...new Set(allStudents.map(s=>String(s.kelas||'').trim()).filter(Boolean))].sort();$('siswa').innerHTML='<h2>Data Siswa</h2><div class="card"><div class="toolbar"><button class="btn success" onclick="downloadSiswaTemplate()">Download Template Excel</button><label class="filebtn">Import Excel<input id="sx" type="file" accept=".xlsx,.xls" onchange="previewSiswaExcel(event)"></label><span class="small">Import aman: NISN 10 digit, nama wajib, duplikat ditolak.</span></div><div id="importPreview"></div></div><div class="card"><h3>Tambah Siswa Manual</h3><div class="formgrid"><label>NISN<input id="sn" inputmode="numeric" maxlength="10"></label><label>Nama<input id="sm"></label><label>Kelas<input id="sk"></label><label>Jurusan<input id="sj" value="TKJ"></label></div><button class="btn" onclick="saveSiswa()">Simpan Siswa</button></div><div class="card"><div class="toolbar"><input class="searchbox" id="sSearch" placeholder="Cari NISN atau nama..." oninput="siswaSearch=this.value;siswaPage=1;renderSiswaTable()"><select class="filterbox" id="sClass" onchange="siswaClass=this.value;siswaPage=1;renderSiswaTable()"><option value="">Semua Kelas</option>'+classes.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select><select class="filterbox" id="sStatus" onchange="siswaStatus=this.value;siswaPage=1;renderSiswaTable()"><option value="">Semua Status</option><option>Aktif</option><option>Nonaktif</option></select><select class="filterbox" id="sPage" onchange="siswaPageSize=+this.value;siswaPage=1;renderSiswaTable()"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select></div><div id="siswaList"></div></div>';renderSiswaTable()}

function downloadSiswaTemplate(){if(typeof XLSX==='undefined')return notify('Library Excel belum termuat. Refresh halaman.',true);const ws=XLSX.utils.aoa_to_sheet([['NISN','Nama_Siswa','Kelas','Jurusan','Tempat_Lahir','Tanggal_Lahir','Nama_Orang_Tua','Nomor_HP_Orang_Tua','Alamat','Status','Tahun_Pelajaran'],['0012345678','Contoh Nama','XI TKJ 2','TKJ','','','','','','Aktif','2026/2027']]);ws['!cols']=[{wch:14},{wch:25},{wch:15},{wch:12},{wch:18},{wch:15},{wch:25},{wch:20},{wch:35},{wch:12},{wch:18}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'DATA_SISWA');XLSX.writeFile(wb,'Template_Data_Siswa_Jurnal_Wali_Kelas.xlsx')}
function normalizeImportRow(r){const keys=['NISN','Nama_Siswa','Kelas','Jurusan','Tempat_Lahir','Tanggal_Lahir','Nama_Orang_Tua','Nomor_HP_Orang_Tua','Alamat','Status','Tahun_Pelajaran'];const x={};keys.forEach(k=>x[k]=r&&Object.prototype.hasOwnProperty.call(r,k)?r[k]:'');x.NISN=String(x.NISN??'').trim().replace(/\.0$/,'');x.Nama_Siswa=String(x.Nama_Siswa??'').trim();return x}
function previewSiswaExcel(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=e=>{try{if(typeof XLSX==='undefined')throw new Error('Library Excel belum termuat.');const wb=XLSX.read(e.target.result,{type:'array',cellDates:false,raw:false});const ws=wb.Sheets[wb.SheetNames[0]];const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:false});if(matrix.length<2)throw new Error('File Excel kosong atau hanya berisi header.');const templateHeaders=['NISN','Nama_Siswa','Kelas','Jurusan','Tempat_Lahir','Tanggal_Lahir','Nama_Orang_Tua','Nomor_HP_Orang_Tua','Alamat','Status','Tahun_Pelajaran'];const headers=(matrix[0]||[]).map(h=>String(h??'').trim());if(headers.join('\u001f')!==templateHeaders.join('\u001f'))throw new Error('Header dan urutan kolom Excel harus PERSIS sesuai template: '+templateHeaders.join(', '));importRows=matrix.slice(1).map(row=>{const x={};templateHeaders.forEach((k,i)=>x[k]=String(row[i]??'').trim());return x;}).filter(r=>Object.values(r).some(v=>v!==''));if(!importRows.length)throw new Error('Tidak ada baris data yang dapat diimpor.');const seen=new Set();let invalid=0,dup=0,newCount=0,upd=0;const existing=new Set(allStudents.map(s=>String(s.nisn).trim()));const html=importRows.slice(0,100).map((r,i)=>{const n=r.NISN,name=r.Nama_Siswa;let st='BARU';if(!/^\d{10}$/.test(n)||!name){st='INVALID';invalid++;}else if(seen.has(n)){st='DUPLIKAT FILE';dup++;}else{seen.add(n);if(existing.has(n)){st='AKAN DIGANTI';upd++;}else newCount++;}return '<tr><td>'+(i+1)+'</td><td>'+esc(n)+'</td><td>'+esc(name)+'</td><td>'+esc(r.Kelas)+'</td><td>'+esc(r.Jurusan)+'</td><td>'+esc(r.Status)+'</td><td><span class="badge '+(st==='INVALID'||st==='DUPLIKAT FILE'?'badgebad':'')+'">'+st+'</span></td></tr>'}).join('');$('importPreview').innerHTML='<div class="msg '+((invalid||dup)?'err':'ok')+'">'+importRows.length+' baris • Baru: '+newCount+' • Data lama akan diganti: '+upd+' • Invalid: '+invalid+' • Duplikat file async function importSiswaExcel(){try{if(!importRows.length)throw new Error('Belum ada data Excel.');const seen=new Set();const templateHeaders=['NISN','Nama_Siswa','Kelas','Jurusan','Tempat_Lahir','Tanggal_Lahir','Nama_Orang_Tua','Nomor_HP_Orang_Tua','Alamat','Status','Tahun_Pelajaran'];for(const r of importRows){if(Object.keys(r).join('\u001f')!==templateHeaders.join('\u001f'))throw new Error('Struktur data tidak sesuai template.');if(!/^\d{10}$/.test(String(r.NISN||''))||!String(r.Nama_Siswa||'').trim())throw new Error('Terdapat NISN tidak valid atau nama kosong.');if(seen.has(String(r.NISN)))throw new Error('Duplikat NISN dalam file: '+r.NISN);seen.add(String(r.NISN))}const res=await call('importSiswaRows',importRows);notify('Import selesai. '+res.berhasil+' siswa tersimpan. Data master lama digantikan; histori tetap aman.');importRows=[];await loadSiswa()}catch(e){notify(e.message,true)}}

function periodLabelClient(p){if(p.period==='mingguan'){const d=new Date(p.weekStart+'T00:00:00');const e=new Date(d);e.setDate(e.getDate()+6);const f=x=>x.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'});return 'Minggu '+f(d)+' s.d. '+f(e)}const m=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];if(p.period==='bulanan')return 'Bulan '+m[p.month-1]+' '+p.year;if(p.period==='semester')return 'Semester '+p.semester+' — Tahun Pelajaran '+p.tahunPelajaran;return 'Tahun Pelajaran '+p.tahunPelajaran}
async function loadReportTable(){
  try{
    lastParams=paramsRekap();
    if(!lastParams.year || lastParams.year<2000 || lastParams.year>2100) throw new Error('Tahun laporan tidak valid.');
    const test=await call('testRekap',lastParams.period,lastParams);
    if(!test || test.success===false) throw new Error(test&&test.message?test.message:'Rekap gagal divalidasi.');
    lastData=lastParams.period==='mingguan'?await call('buildRekap',lastParams.period,lastParams):await call('generateAndSaveRekap',lastParams.period,lastParams);
    if(!Array.isArray(lastData)) throw new Error('Server tidak mengembalikan data rekap.');
    if(!lastData.length){ const dg=await call('diagnoseRekap',lastParams.period,lastParams); $('rt').innerHTML='<div class="msg err"><b>Rekap menghasilkan 0 siswa.</b><br>Data siswa terbaca: '+esc(dg.siswa)+' | Absensi: '+esc(dg.absensi)+' | Absensi periode: '+esc(dg.absensiPeriode)+' | Hasil build: '+esc(dg.rekap)+'<br>Header ABSENSI: '+esc((dg.headers&&dg.headers.ABSENSI||[]).join(' | '))+'</div>'; throw new Error('Rekap menghasilkan 0 siswa.'); }
    renderTable(lastData);
    notify('Rekap berhasil dibuat: '+periodLabelClient(lastParams)+' — '+lastData.length+' siswa.');
  }catch(e){
    console.error(e);
    $('rt').innerHTML='<div class="msg err"><b>Rekap gagal ditampilkan.</b><br>'+esc(e.message||e)+'</div>';
    notify(e.message||e,true);
  }
}
function renderTable(d){lastData=Array.isArray(d)?d:[];var rows=d.map(function(x,i){var tindak=(x.statusPembinaan&&x.statusPembinaan!=='NORMAL')?'Pembinaan sesuai keputusan sistem':'Tidak ada';return '<tr><td>'+(i+1)+'</td><td>'+esc(x.nisn)+'</td><td>'+esc(x.nama)+'</td><td>'+x.kehadiran+'%</td><td>'+x.poinPelanggaran+'</td><td>'+x.poinPenghargaan+'</td><td>'+esc(x.statusPembinaan||'NORMAL')+' — '+esc(tindak)+'</td><td><button class="btn" onclick="detailStudent(\''+esc(x.nisn)+'\')">Detail</button><button class="btn secondary" onclick="editRekap('+((x.row)||i+2)+','+i+')">Edit</button><button class="btn danger" onclick="deleteRekap('+((x.row)||i+2)+')">Hapus</button></td></tr>';}).join('');$('rt').innerHTML='<div class="card"><h3>'+esc(periodLabelClient(lastParams))+'</h3><div class="small">Rekap ringkas. Gunakan Detail untuk melihat rincian siswa.</div><div class="scroll"><table><tr><th>No</th><th>NISN</th><th>Nama</th><th>Persentase Kehadiran</th><th>Total Poin Pelanggaran</th><th>Poin Penghargaan</th><th>Tindak Lanjut</th><th>Aksi</th></tr>'+rows+'</table></div></div>'}

function downloadPdfClient_(result){
  if(!result||!result.dataBase64)throw new Error('Data PDF tidak tersedia dari server. Pastikan tombol Download PDF pada aplikasi digunakan, bukan link Google Drive.');
  const raw=atob(result.dataBase64),bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  if(bytes.length<5||String.fromCharCode(bytes[0],bytes[1],bytes[2],bytes[3],bytes[4])!=='%PDF-')throw new Error('Data PDF tidak valid. Silakan ulangi pembuatan laporan.');
  const blob=new Blob([bytes],{type:'application/pdf'});
  if(window.navigator&&typeof window.navigator.msSaveOrOpenBlob==='function'){window.navigator.msSaveOrOpenBlob(blob,result.name||'Laporan.pdf');return;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=result.name||'Laporan.pdf';a.rel='noopener';a.style.position='fixed';a.style.left='-10000px';a.style.width='1px';a.style.height='1px';
  document.body.appendChild(a);
  try{a.click();}finally{setTimeout(function(){a.remove();URL.revokeObjectURL(url);},30000);}
}

function closeModal(){$('modal').classList.add('hide');$('modalBody').innerHTML=''}

async function loadBina(){await ensureStudents();$('bina').innerHTML='<h2>Pembinaan & Pemanggilan Orang Tua</h2><div class="formgrid"><label>Siswa<select id="bn" onchange="loadBinaProfile()">'+studentOptions()+'</select></label><label>Dari<input id="bf" type="date"></label><label>Sampai<input id="bt" type="date"></label></div><div id="bprof"></div><div class="toolbar"><button class="btn secondary" onclick="savePglManual()">Catat Pemanggilan</button><button class="btn success" onclick="previewSurat()">Preview Surat Pemanggilan</button></div><h3>Riwayat Tindakan Pembinaan</h3><div id="thist"></div><h3>Riwayat Pemanggilan Orang Tua</h3><div id="phist"></div>';loadBinaProfile();loadBinaHistory()}
async function loadBinaProfile(){const n=$('bn')?.value;if(!n)return;try{const d=await call('getStudentStatusAlert',n),a=await call('getAttendanceRiskForStudent',n);$('bprof').innerHTML='<div class="grid"><div class="card"><b>Poin Pelanggaran</b><div class="stat">'+d.poinPelanggaran+'</div></div><div class="card"><b>Poin Penghargaan</b><div class="stat">'+d.poinPenghargaan+'</div></div><div class="card"><b>Poin Bersih</b><div class="stat">'+d.poinBersih+'</div></div><div class="card"><b>Status Otomatis</b><div class="stat" style="font-size:20px">'+esc(d.status)+'</div><div>'+esc(d.tindakan)+'</div></div><div class="card"><b>Pemanggilan Ke</b><div class="stat">'+d.pemanggilan+'</div><div>'+esc(d.pihak||'-')+'</div></div><div class="card"><b>Dokumen</b><div class="stat" style="font-size:18px">'+esc(d.dokumen||'-')+'</div><div class="small">Status/tahap ditentukan otomatis oleh Rule Engine.</div></div></div><div class="card" style="margin-top:10px"><h3>Risiko Absensi Otomatis</h3><div class="grid"><div><span class="small">Kehadiran Semester</span><div class="stat">'+Number(a.kehadiran).toFixed(2)+'%</div></div><div><span class="small">Alpa Semester</span><div class="stat">'+a.A+'</div></div><div><span class="small">Alpa Tahunan</span><div class="stat">'+a.alphaAnnual+'</div></div><div><span class="small">Status Risiko</span><div class="stat" style="font-size:18px">'+esc(a.riskLabel)+'</div></div></div><div class="small">'+esc(a.riskReason)+' • Minimum '+a.minAttendance+'% • Maks. Alpa semester '+a.maxAlphaSemester+' • Maks. tahunan '+a.maxAlphaAnnual+'</div></div>';loadEarlyWarningProfile(n);}catch(e){notify(e.message,true)}}

async function loadBinaHistory(){const f=$('bf')?.value||'',t=$('bt')?.value||'',n=$('bn')?.value||'';try{const a=await call('getTindakanHistory',{from:f,to:t,nisn:n}),b=await call('getPemanggilanHistory',{from:f,to:t,nisn:n});$('thist').innerHTML='<div class="scroll"><table><tr><th>Tanggal</th><th>NISN</th><th>Nama</th><th>Poin</th><th>Status</th><th>Tindakan</th><th>Aksi</th></tr>'+(a.length?a.map(x=>'<tr><td>'+esc(x.tanggal)+'</td><td>'+esc(x.nisn)+'</td><td>'+esc(x.nama)+'</td><td>'+x.totalPoin+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.tindakan)+'</td><td><button class="btn secondary" onclick="ubahTindakan(\''+esc(x.id)+'\')">Status</button></td></tr>').join(''):'<tr><td colspan="7">Belum ada tindakan.</td></tr>')+'</table></div>';$('phist').innerHTML='<div class="scroll"><table><tr><th>Tanggal</th><th>NISN</th><th>Nama</th><th>Poin</th><th>Ke</th><th>Pihak</th><th>Status</th><th>Aksi</th></tr>'+(b.length?b.map(x=>'<tr><td>'+esc(x.tanggal)+'</td><td>'+esc(x.nisn)+'</td><td>'+esc(x.nama)+'</td><td>'+x.poin+'</td><td>'+esc(x.ke)+'</td><td>'+esc(x.pihak)+'</td><td>'+esc(x.status)+'</td><td><button class="btn secondary" onclick="ubahPemanggilan(\''+esc(x.id)+'\')">Status</button></td></tr>').join(''):'<tr><td colspan="8">Belum ada pemanggilan.</td></tr>')+'</table></div>'}catch(e){notify(e.message,true)}}
async function savePglManual(){const n=$('bn')?.value;if(!n)return notify('Pilih siswa.',true);const d=await call('getProfilPembinaan',n);await call('savePemanggilan',{nisn:n,tanggal:new Date().toISOString().slice(0,10),ke:d.keputusan.pemanggilan||1,pihak:'Wali Kelas',hasil:'Menunggu hasil pertemuan',tindakLanjut:'Dilanjutkan pembinaan sesuai keputusan sistem',status:'Belum Selesai'});notify('Pemanggilan dicatat.');loadBinaHistory()}
async function ubahTindakan(id){const st=prompt('Status tindakan: Belum / Proses / Selesai','Selesai');if(st===null)return;await call('updateTindakanStatus',id,st,'Diperbarui melalui Web App');loadBinaHistory();notify('Status tindakan diperbarui.')}
async function ubahPemanggilan(id){const st=prompt('Status pemanggilan: Belum / Proses / Selesai','Selesai');if(st===null)return;const h=prompt('Hasil pertemuan','');const tl=prompt('Tindak lanjut','');await call('updatePemanggilanStatus',id,st,h||'',tl||'');loadBinaHistory();notify('Status pemanggilan diperbarui.')}
async function previewSurat(){const n=$('bn')?.value;if(!n)return notify('Pilih siswa.',true);const d=await call('getProfilPembinaan',n),k=d.keputusan.pemanggilan||1,h=await call('renderSuratPemanggilanHtml',n,k);$('modalTitle').textContent='Preview Surat Pemanggilan';$('modalBody').innerHTML='';const f=document.createElement('iframe');f.className='preview';f.srcdoc=h;$('modalBody').appendChild(f);const b=document.createElement('button');b.className='btn success';b.textContent='Download PDF Surat';b.onclick=async()=>{try{const x=await call('createPdfSuratPemanggilan',n,k);downloadPdfClient_(x);notify('PDF surat berhasil diunduh.')}catch(e){notify(e.message,true)}};$('modalBody').appendChild(b);$('modal').classList.remove('hide')}
async function loadDok(){$('dok').innerHTML='<h2>Dokumen Sekolah</h2><p>Upload kop surat, logo, dan tanda tangan.</p><div class="formgrid"><label>Jenis<select id="dt"><option>KOP_SURAT</option><option>LOGO</option><option>TTD_WALI</option><option>TTD_WAKA</option><option>TTD_BK</option><option>TTD_KEPSEK</option></select></label><label>File<input id="df" type="file" accept="image/*"></label></div><button class="btn" onclick="uploadDoc()">Upload</button>'}
async function uploadDoc(){const f=$('df').files[0];if(!f)return notify('Pilih file',true);const rd=new FileReader();rd.onload=async()=>{try{await call('uploadDocument',{jenis:$('dt').value,name:f.name,mimeType:f.type,data:rd.result});notify('Dokumen berhasil diupload')}catch(e){notify(e.message,true)}};rd.readAsDataURL(f)}
async function loadEarlyWarningDash(){
  try{
    const ew=await call('getEarlyWarningSummary');
    const old=document.getElementById('earlyWarningPanel'); if(old)old.remove();
    const box=document.createElement('div'); box.id='earlyWarningPanel'; box.className='card';
    const items=(ew.items||[]).slice(0,15);
    box.innerHTML='<h3>🚨 Early Warning & Intervensi</h3><div class="small">Peringatan aktif: '+(ew.totalOpen||0)+' • HIGH: '+((ew.counts||{}).HIGH||0)+' • MEDIUM: '+((ew.counts||{}).MEDIUM||0)+'</div>'+
      (items.length?'<div class="scroll" style="margin-top:8px"><table><tr><th>Siswa</th><th>Severity</th><th>Peringatan</th><th>Kehadiran</th><th>Poin</th><th>Rekomendasi</th></tr>'+items.map(k=>'<tr><td>'+esc(k.nama)+'</td><td><span class="badge">'+esc(k.severity)+'</span></td><td>'+esc(k.jenis)+'</td><td>'+Number(k.kehadiran||0).toFixed(2)+'%</td><td>'+k.poin+'</td><td>'+esc(k.rekomendasi)+'</td></tr>').join('')+'</table></div>':'<div class="small" style="margin-top:8px">Tidak ada peringatan dini terbuka.</div>');
    const dash=document.getElementById('dash'); if(dash)dash.appendChild(box);
  }catch(e){console.log(e)}
}

async function loadEarlyWarningProfile(nisn){
  try{
    const u=await call('getUnifiedRiskForStudent',nisn), ew=await call('getEarlyWarningForStudent',nisn);
    const old=document.getElementById('earlyWarningProfile'); if(old)old.remove();
    const box=document.createElement('div'); box.id='earlyWarningProfile'; box.className='card';
    box.innerHTML='<h3>🚨 Early Warning</h3><div class="small">Indeks monitoring <b>'+Number(u.indeksMonitoring||0).toFixed(2)+'</b> • '+esc(u.level||'')+'</div>'+
      ((ew||[]).length?'<div class="scroll" style="margin-top:8px"><table><tr><th>Severity</th><th>Peringatan</th><th>Rekomendasi</th><th>Status</th></tr>'+ew.slice(0,10).map(k=>'<tr><td>'+esc(k.severity)+'</td><td>'+esc(k.jenis)+'</td><td>'+esc(k.rekomendasi)+'</td><td>'+esc(k.status)+'</td></tr>').join('')+'</table></div>':'<div class="small" style="margin-top:8px">Belum ada riwayat peringatan dini.</div>');
    const prof=document.getElementById('bprof'); if(prof)prof.appendChild(box);
  }catch(e){console.log(e)}
}

</script>
<script>
function syncDatabaseUI(ev){
  const btn=ev&&ev.currentTarget?ev.currentTarget:null;
  if(btn){btn.disabled=true;btn.textContent='Menyinkronkan...';}
  call('apiSyncDatabase').then(function(){
    if(btn){btn.disabled=false;btn.textContent='Sinkronisasi Database';}
    notify('Database berhasil disinkronkan.');
    refreshLiveDatabase();
  }).catch(function(err){
    if(btn){btn.disabled=false;btn.textContent='Sinkronisasi Database';}
    notify(err&&err.message?err.message:String(err),true);
  });
}
</script>
